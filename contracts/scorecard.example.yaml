version: scorecard-2026.11-m2-final
draft_only: false
source: "Final M2 expert-rule scorecard approved for implementation on 2026-11-04: 213 valid questionnaire responses, directional BNPL external comparison, and industry anchors."
calibration_notes:
  - "DTI warning starts at 30% and the high-pressure line is 50%."
  - "Debt concentration uses simultaneous installment count, not BNPL single-loan term."
  - "IRR is annualized as (1 + monthly_irr)^12 - 1."
  - "Behavior and resilience points are capped at 30."
rounding: round_half_up
risk_levels:
  - {min_score: 0, max_score: 24, level: "低风险"}
  - {min_score: 25, max_score: 49, level: "关注"}
  - {min_score: 50, max_score: 74, level: "中风险"}
  - {min_score: 75, max_score: 100, level: "高风险"}
dimensions:
  - id: debt_to_income
    label: "月供负债收入比"
    weight: 0.35
    max_score: 35
    feature: "monthly_fixed_outflow_total / income_total"
    interpolation: step
    points: [[0.0, 0], [0.3, 12], [0.4, 24], [0.5, 35]]
  - id: debt_stack
    label: "多头分期笔数"
    weight: 0.15
    max_score: 15
    feature: "debt_count"
    interpolation: step
    points: [[0, 0], [3, 6], [4, 10], [5, 15]]
  - id: real_cost
    label: "IRR真实年化成本"
    weight: 0.20
    max_score: 20
    feature: "max(annualized_irr for debts where status == ok)"
    interpolation: step
    points: [[0.0, 0], [0.1, 6], [0.24, 12], [0.36, 20]]
  - id: behavior_resilience
    label: "行为与韧性"
    weight: 0.30
    max_score: 30
    feature: "configured behavior and resilience signals"
    rules:
      borrow_to_repay: 11
      strict_overdue_min_count: 2
      strict_overdue: 6
      insufficient_month_points: [0, 2, 4, 6]
      income_drop_30_cannot_cover: 4
      cognitive_weak_threshold: 3
      cognitive_weak: 3
